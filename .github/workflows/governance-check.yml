name: Governance

on:
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - PLANS.md
      - CONTRIBUTING.md
      - SECURITY.md
      - docs/**
      - prompts/**
      - .claude/**
      - .agents/**
      - scripts/check.sh
      - scripts/check-scoped.sh
      - scripts/validate_repo_governance.py
      - .github/workflows/governance-check.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - CLAUDE.md
      - PLANS.md
      - CONTRIBUTING.md
      - SECURITY.md
      - docs/**
      - prompts/**
      - .claude/**
      - .agents/**
      - scripts/check.sh
      - scripts/check-scoped.sh
      - scripts/validate_repo_governance.py
      - .github/workflows/governance-check.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository governance
        run: python3 scripts/validate_repo_governance.py
