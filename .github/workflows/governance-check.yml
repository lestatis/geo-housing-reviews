name: Governance

# No `paths:` on pull_request — see backend-check.yml. This one runs in full every time: it takes
# seconds, and it is the check that would catch a pull request editing the ruleset or the rules.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - CLAUDE.md
      - PLANS.md
      - CONTRIBUTING.md
      - SECURITY.md
      - docs/**
      - prompts/**
      - .claude/**
      - .agents/**
      - scripts/check.sh
      - scripts/check-scoped.sh
      - scripts/validate_repo_governance.py
      - .github/workflows/governance-check.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    # The ruleset references this string.
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository governance
        run: python3 scripts/validate_repo_governance.py
