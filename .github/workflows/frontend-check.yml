name: Frontend

# No `paths:` on pull_request, on purpose — see backend-check.yml for why a required check must
# always report. The push trigger keeps its filter.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/mobile/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - docs/api/openapi.json
      - .github/workflows/frontend-check.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # The ruleset references this string.
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether the frontend changed
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git diff --name-only "$base" "${{ github.sha }}" \
              | grep -qE '^(apps/web/|apps/mobile/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|docs/api/openapi\.json$|\.github/workflows/frontend-check\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Nothing under apps/web changed; reporting success without running the gate."
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: "22"
      - name: Enable Corepack
        if: steps.changes.outputs.relevant == 'true'
        run: corepack enable
      - name: Install frontend dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm lint
      - name: Test
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm test
      - name: Typecheck
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm typecheck
