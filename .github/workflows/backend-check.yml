name: Backend

# No `paths:` on pull_request, on purpose. This check is required by the main ruleset, and a
# required check that is skipped never reports — GitHub then waits for it forever and a docs-only
# pull request can never merge. So the job always runs and decides for itself whether there is
# anything to do. The push trigger keeps its filter: post-merge runs do not affect protection.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - docs/api/openapi.json
      - .github/workflows/backend-check.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # The ruleset references this string. Change it there too, or the check is never satisfied.
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether the backend changed
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git diff --name-only "$base" "${{ github.sha }}" \
              | grep -qE '^(apps/api/|docs/api/openapi\.json$|\.github/workflows/backend-check\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Nothing under apps/api changed; reporting success without running the gate."
          fi
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.changes.outputs.relevant == 'true'
      - name: Run backend checks
        if: steps.changes.outputs.relevant == 'true'
        working-directory: apps/api
        run: ./gradlew check
