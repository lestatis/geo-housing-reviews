# Build performance. The gate's cost is dominated by :app:test, where most test classes start
# their own PostgreSQL container; these settings let independent work overlap instead of queueing.
# See CONTRIBUTING.md "Required checks" for the fast local loop.

# Modules are independent, so their compile/check tasks can run concurrently.
org.gradle.parallel=true

# Reuses task outputs across branches, which matters when switching between chunk branches.
org.gradle.caching=true

# The default daemon heap is not enough once several test workers and Testcontainers clients run
# side by side.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
