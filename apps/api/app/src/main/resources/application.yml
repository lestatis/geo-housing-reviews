spring:
  application:
    name: geo-housing-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/geo_housing}
    username: ${DB_USER:geo_housing}
    password: ${DB_PASSWORD:geo_housing}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OIDC_JWK_SET_URI:https://issuer.invalid/.well-known/jwks.json}

identity:
  auth:
    # Server-side HMAC pepper for auth-subject hashing (ADR-0006). Never committed; injected per
    # environment. The empty default is deliberate: a blank pepper fails fast at startup rather than
    # hashing every subject with an empty key. Tests supply a fixed non-secret pepper via the build.
    subject-pepper: ${IDENTITY_AUTH_SUBJECT_PEPPER:}

verification:
  evidence:
    storage:
      # Quarantined evidence bucket (ADR-0008). Defaults point at the local MinIO in
      # infra/docker/docker-compose.yml; production injects a real endpoint/bucket/credentials, or
      # leaves credentials blank to use an instance role. Credentials here are throwaway localhost
      # values, never reused in a deployed environment.
      endpoint: ${EVIDENCE_S3_ENDPOINT:http://localhost:9000}
      region: ${EVIDENCE_S3_REGION:us-east-1}
      bucket: ${EVIDENCE_S3_BUCKET:verification-evidence}
      access-key-id: ${EVIDENCE_S3_ACCESS_KEY:geo_housing_evidence}
      secret-access-key: ${EVIDENCE_S3_SECRET_KEY:geo_housing_evidence}
      max-upload-bytes: ${EVIDENCE_MAX_UPLOAD_BYTES:10485760}
      path-style-access: ${EVIDENCE_S3_PATH_STYLE:true}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
