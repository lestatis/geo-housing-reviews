spring:
  application:
    name: geo-housing-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/geo_housing}
    username: ${DB_USER:geo_housing}
    password: ${DB_PASSWORD:geo_housing}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
