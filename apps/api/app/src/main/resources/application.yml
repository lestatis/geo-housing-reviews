spring:
  application:
    name: geo-housing-api
  servlet:
    multipart:
      # Keep the servlet boundary aligned with the evidence-store cap. Operators changing the cap
      # must set both variables; the store remains the final, pre-storage enforcement point.
      max-file-size: ${EVIDENCE_MAX_UPLOAD_BYTES:10485760}
      max-request-size: ${EVIDENCE_MAX_REQUEST_BYTES:11534336}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/geo_housing}
    username: ${DB_USER:geo_housing}
    password: ${DB_PASSWORD:geo_housing}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Off on purpose: ModuleMigrationConfiguration defines one Flyway instance per module, each with
    # its own history table, so a module's migrations are ordered only against its own. A single
    # auto-configured instance orders them globally, which makes any new migration for a
    # low-numbered module out of order on a database that already has the higher-numbered ones.
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OIDC_JWK_SET_URI:https://issuer.invalid/.well-known/jwks.json}

identity:
  auth:
    # Server-side HMAC pepper for auth-subject hashing (ADR-0006). Never committed; injected per
    # environment. The empty default is deliberate: a blank pepper fails fast at startup rather than
    # hashing every subject with an empty key. Tests supply a fixed non-secret pepper via the build.
    subject-pepper: ${IDENTITY_AUTH_SUBJECT_PEPPER:}

verification:
  evidence:
    storage:
      # Quarantined evidence bucket (ADR-0008). Defaults point at the local MinIO in
      # infra/docker/docker-compose.yml; production injects a real endpoint/bucket/credentials, or
      # leaves credentials blank to use an instance role. Credentials here are throwaway localhost
      # values, never reused in a deployed environment.
      endpoint: ${EVIDENCE_S3_ENDPOINT:http://localhost:9000}
      region: ${EVIDENCE_S3_REGION:us-east-1}
      bucket: ${EVIDENCE_S3_BUCKET:verification-evidence}
      access-key-id: ${EVIDENCE_S3_ACCESS_KEY:geo_housing_evidence}
      secret-access-key: ${EVIDENCE_S3_SECRET_KEY:geo_housing_evidence}
      max-upload-bytes: ${EVIDENCE_MAX_UPLOAD_BYTES:10485760}
      path-style-access: ${EVIDENCE_S3_PATH_STYLE:true}
    retention:
      # Placeholders until legal review fixes the real periods (SECURITY_PRIVACY §6). Deliberately
      # configuration, so a legal answer changes settings rather than code.
      upload-retention-days: ${EVIDENCE_UPLOAD_RETENTION_DAYS:30}
      post-decision-retention-days: ${EVIDENCE_POST_DECISION_RETENTION_DAYS:7}
      # The scheduled sweep is bounded so a large backlog never monopolizes an application worker.
      sweep-batch-size: ${EVIDENCE_RETENTION_SWEEP_BATCH_SIZE:100}
      sweep-fixed-delay: ${EVIDENCE_RETENTION_SWEEP_DELAY:PT15M}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
