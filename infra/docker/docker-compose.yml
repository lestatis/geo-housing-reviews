# Local development database only. Credentials below are throwaway
# defaults for localhost use — never reuse them in a shared or deployed
# environment.
services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: geo_housing
      POSTGRES_USER: geo_housing
      POSTGRES_PASSWORD: geo_housing
    ports:
      - "5432:5432"
    volumes:
      - geo_housing_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_housing -d geo_housing"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local quarantined evidence store (ADR-0008). Throwaway credentials for localhost only.
  # Create the private bucket once after first start:
  #   docker run --rm --network host minio/mc \
  #     mc alias set local http://localhost:9000 geo_housing_evidence geo_housing_evidence &&
  #     mc mb --ignore-existing local/verification-evidence
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: geo_housing_evidence
      MINIO_ROOT_PASSWORD: geo_housing_evidence
      # Evidence is written with server-side encryption (S3EvidenceStore, ADR-0008), and MinIO
      # refuses an encrypted PUT outright unless it has a key — "Server side encryption specified
      # but KMS is not configured", a 501. Without this line an upload has never worked locally.
      # A throwaway localhost key, the same one the backend integration tests use; production uses
      # a real KMS.
      MINIO_KMS_SECRET_KEY: "key1:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - geo_housing_evidence_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local OIDC provider for development and end-to-end tests. It is NOT a vendor decision — P-008
  # reserves that for an ADR. It exists so the API validates real signatures against a real JWKS and
  # the admin app runs a real authorization-code flow, instead of a bypass that would hide the whole
  # integration until the day a vendor is picked.
  #
  # It signs anything asked of it, so it must never be reachable from a deployed environment: the
  # port binds to loopback only, and OIDC_JWK_SET_URI stays at its issuer.invalid default unless a
  # developer sets it. Roles come from our own account table (ADR-0005), never from the token, so a
  # provider that mints arbitrary claims still cannot mint an administrator.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:5.0.2
    environment:
      # Serve the issuer under the same host:port the browser uses, so the discovery document the
      # API reads and the URLs the browser is redirected to agree.
      SERVER_PORT: 8081
      JSON_CONFIG: >-
        {"interactiveLogin":true,
         "httpServer":"NettyWrapper",
         "tokenCallbacks":[]}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:8081/default/.well-known/openid-configuration",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  geo_housing_postgres_data:
  geo_housing_evidence_data:
