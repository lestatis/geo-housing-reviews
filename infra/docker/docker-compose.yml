# Local development database only. Credentials below are throwaway
# defaults for localhost use — never reuse them in a shared or deployed
# environment.
services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: geo_housing
      POSTGRES_USER: geo_housing
      POSTGRES_PASSWORD: geo_housing
    ports:
      - "5432:5432"
    volumes:
      - geo_housing_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_housing -d geo_housing"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local quarantined evidence store (ADR-0008). Throwaway credentials for localhost only.
  # Create the private bucket once after first start:
  #   docker run --rm --network host minio/mc \
  #     mc alias set local http://localhost:9000 geo_housing_evidence geo_housing_evidence &&
  #     mc mb --ignore-existing local/verification-evidence
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: geo_housing_evidence
      MINIO_ROOT_PASSWORD: geo_housing_evidence
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - geo_housing_evidence_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  geo_housing_postgres_data:
  geo_housing_evidence_data:
